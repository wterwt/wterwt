<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 200" width="1180" height="200" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>

    <radialGradient id="fglow" cx="0.5" cy="1.05" r="0.85">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ftext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b949e"/>
      <stop offset="0.5" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#8b949e"/>
    </linearGradient>

    <linearGradient id="fw1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fw2" x1="0" y1="0" x2="1" y2="0">
