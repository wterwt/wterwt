      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fw3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c8cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="200" fill="url(#fbg)"/>
  <rect width="1180" height="200" fill="url(#fglow)"/>

  <!-- wave layers -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 96 C 150 62, 300 128, 470 96 S 800 46, 980 100 S 1130 122, 1180 92" stroke="url(#fw1)" stroke-width="1.8"/>
    <path d="M0 116 C 170 84, 330 146, 520 114 S 840 70, 1010 118 S 1140 138, 1180 112" stroke="url(#fw2)" stroke-width="1.5"/>
    <path d="M0 138 C 190 108, 360 164, 560 134 S 870 96, 1040 138 S 1150 154, 1180 132" stroke="url(#fw3)" stroke-width="1.3"/>
  </g>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="590" y="34" font-size="13" letter-spacing="4.6" fill="#8b949e">ALWAYS LEARNING&#160;&#160;&#183;&#160;&#160;ALWAYS BUILDING</text>
    <text x="590" y="176" font-size="16" font-weight="600" fill="url(#ftext)">&#127769; Keep coding, keep dreaming. &#9876;</text>
  </g>

  <g fill="#9ecbff" fill-opacity="0.6">
    <circle cx="330" cy="176" r="2"/>
    <circle cx="850" cy="176" r="2"/>
  </g>
