<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" width="1180" height="340" role="img" aria-label="簟秋 · wterwt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.92" r="0.72">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.62" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="0.55" stop-color="#9ecbff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#7c8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.25" fill="#8aa0b8" fill-opacity="0.20"/>
    </pattern>

    <linearGradient id="dotsFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotsMask">
      <rect width="1180" height="340" fill="url(#dotsFade)"/>
    </mask>
  </defs>

  <!-- base -->
  <rect width="1180" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1180" height="340" rx="18" fill="url(#glowA)"/>
  <rect width="1180" height="340" rx="18" fill="url(#glowB)"/>
  <rect width="1180" height="340" rx="18" fill="url(#glowC)"/>
  <rect width="1180" height="340" rx="18" fill="url(#dots)" mask="url(#dotsMask)"/>

  <!-- frame -->
  <rect x="24.5" y="24.5" width="1131" height="291" rx="20" fill="none" stroke="#58a6ff" stroke-opacity="0.22"/>
  <rect x="36.5" y="36.5" width="1107" height="267" rx="14" fill="none" stroke="#a855f7" stroke-opacity="0.10"/>

  <!-- corner ticks -->
  <g stroke="#58a6ff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M40 74 L40 44 L70 44"/>
    <path d="M1110 44 L1140 44 L1140 74"/>
    <path d="M1140 266 L1140 296 L1110 296"/>
    <path d="M70 296 L40 296 L40 266"/>
  </g>

  <!-- orbit mark -->
  <g transform="translate(930 170)">
    <circle r="112" fill="none" stroke="#58a6ff" stroke-opacity="0.16"/>
    <circle r="84" fill="none" stroke="#a855f7" stroke-opacity="0.22" stroke-dasharray="5 11"/>
    <circle r="56" fill="none" stroke="#22d3ee" stroke-opacity="0.26"/>
    <circle r="28" fill="#58a6ff" fill-opacity="0.07"/>
    <g fill="#9ecbff">
      <circle cx="0" cy="-112" r="3.2" fill-opacity="0.9"/>
      <circle cx="84" cy="0" r="2.6" fill-opacity="0.7"/>
      <circle cx="-56" cy="0" r="2.2" fill-opacity="0.6"/>
      <circle cx="0" cy="56" r="2.6" fill-opacity="0.55"/>
    </g>
    <text x="0" y="13" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
          font-size="38" font-weight="700" fill="#c9d8ee" fill-opacity="0.92" letter-spacing="-1">&lt;/&gt;</text>
  </g>

  <!-- sparkles -->
  <g fill="#e6edf3" fill-opacity="0.55">
    <path d="M180 84 l2.4 6.2 6.2 2.4 -6.2 2.4 -2.4 6.2 -2.4 -6.2 -6.2 -2.4 6.2 -2.4 z"/>
    <path d="M690 262 l1.9 5 5 1.9 -5 1.9 -1.9 5 -1.9 -5 -5 -1.9 5 -1.9 z" fill-opacity="0.4"/>
  </g>

  <!-- copy -->
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="112" font-size="13" letter-spacing="5.2" fill="#8b949e">STUDENT DEVELOPER</text>
    <text x="308" y="112" font-size="13" letter-spacing="2.4" fill="#58a6ff">@wterwt</text>
    <text x="70" y="182" font-size="56" font-weight="700" fill="url(#nameGrad)" letter-spacing="4">簟秋</text>
    <rect x="72" y="206" width="196" height="2" rx="1" fill="url(#ruleGrad)"/>
    <text x="72" y="238" font-size="17" fill="#a9b6c6">Frontend / Backend &#160;&#183;&#160; Anime / Open Source / UI Design</text>
    <text x="72" y="276" font-size="14.5" font-style="italic" fill="#7d8590">&#8220;Talk is cheap. Show me the code.&#8221;</text>
  </g>

  <!-- wave accent -->
  <g fill="none" stroke="url(#waveGrad)" stroke-linecap="round">
    <path d="M0 312 C 160 292, 300 330, 470 310 S 800 288, 980 314 S 1120 322, 1180 304" stroke-width="1.6" stroke-opacity="0.75"/>
    <path d="M0 326 C 170 306, 320 342, 500 322 S 820 302, 1000 326 S 1130 334, 1180 318" stroke-width="1.2" stroke-opacity="0.4"/>
  </g>
</svg>
